name: Sync Antigravity Knowledge to Google Drive

on:
  push:
    branches:
      - main
    paths:
      - 'governance/**'
      - 'skills/**'
      - 'global_workflows/**'
      - 'GEMINI.md'
      - '.github/workflows/notebooklm-to-gdrive.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Aggregated Markdown
        run: |
          cat << 'EOF' > generate.py
          import os, glob
          from datetime import datetime

          output_file = "notebooklm-source.md"

          with open(output_file, "w", encoding="utf-8") as f:
              f.write("# Antigravity Knowledge Base\n\n")
              f.write(f"**最終更新日時:** {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\n\n")
              f.write("---\n\n")

              # 1. ガバナンス一覧
              f.write("## 1. ガバナンス一覧\n\n")
              gov_files = sorted(glob.glob("governance/*.md"))
              if os.path.exists("GEMINI.md"):
                  gov_files.insert(0, "GEMINI.md")
              
              for path in gov_files:
                  f.write(f"### ファイル: {os.path.basename(path)}\n\n")
                  with open(path, "r", encoding="utf-8") as gf:
                      f.write(gf.read() + "\n\n")

              f.write("---\n\n")

              # 2. スキル集
              f.write("## 2. スキル集\n\n")
              skill_files = sorted(glob.glob("skills/*/SKILL.md"))
              for path in skill_files:
                  skill_name = os.path.basename(os.path.dirname(path))
                  f.write(f"### スキル: {skill_name}\n\n")
                  with open(path, "r", encoding="utf-8") as sf:
                      f.write(sf.read() + "\n\n")

              f.write("---\n\n")

              # 3. ワークフロー集
              f.write("## 3. ワークフロー集\n\n")
              workflow_files = sorted(glob.glob("global_workflows/*.md"))
              for path in workflow_files:
                  workflow_name = os.path.basename(path).replace(".md", "")
                  f.write(f"### ワークフロー: {workflow_name}\n\n")
                  with open(path, "r", encoding="utf-8") as wf:
                      f.write(wf.read() + "\n\n")
          EOF
          python generate.py

      # rcloneをインストールして設定・アップロードを実行
      - name: Install and Run rclone
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          # rcloneのインストール
          sudo curl https://rclone.org/install.sh | sudo bash

          # 設定ファイルの作成（環境変数からトークンを組み立て）
          # NOTE: access_tokenはダミーを入れるとrefresh_tokenを使って自動更新されます
          mkdir -p ~/.config/rclone
          cat << EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          client_id = ${GDRIVE_CLIENT_ID}
          client_secret = ${GDRIVE_CLIENT_SECRET}
          scope = drive
          token = {"access_token":"dummy","token_type":"Bearer","refresh_token":"${GDRIVE_REFRESH_TOKEN}","expiry":"2023-01-01T00:00:00Z"}
          EOF

          # アップロード実行
          # copyto を使うことで、宛先のファイル名を固定して上書きできます
          rclone copy notebooklm-source.md gdrive:${GDRIVE_FOLDER_ID}/ -v
