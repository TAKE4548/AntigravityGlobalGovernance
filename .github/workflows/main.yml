name: Sync Antigravity Knowledge to Google Drive

on:
  push:
    branches:
      - main
    paths:
      - 'governance/**'
      - 'skills/**'
      - 'global_workflows/**'
      - 'GEMINI.md'
      - '.github/workflows/notebooklm-to-gdrive.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Aggregated Markdown
        run: |
          cat << 'EOF' > generate.py
          import os, glob
          from datetime import datetime

          output_file = "notebooklm-source.md"

          with open(output_file, "w", encoding="utf-8") as f:
              f.write("# Antigravity Knowledge Base\n\n")
              f.write(f"**最終更新日時:** {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\n\n")
              f.write("---\n\n")

              # 1. ガバナンス一覧 (governance/*.md + GEMINI.md)
              f.write("## 1. ガバナンス一覧\n\n")
              gov_files = glob.glob("governance/*.md")
              if os.path.exists("GEMINI.md"):
                  gov_files.insert(0, "GEMINI.md")
              
              if gov_files:
                  for path in gov_files:
                      f.write(f"### ファイル: {os.path.basename(path)}\n\n")
                      with open(path, "r", encoding="utf-8") as gf:
                          f.write(gf.read() + "\n\n")
              else:
                  f.write("ガバナンス資料が見つかりませんでした。\n\n")

              f.write("---\n\n")

              # 2. スキル集 (skills/*/SKILL.md)
              f.write("## 2. スキル集\n\n")
              skill_files = glob.glob("skills/*/SKILL.md")
              if skill_files:
                  for path in skill_files:
                      # ディレクトリ名（スキル名）を取得
                      skill_name = os.path.basename(os.path.dirname(path))
                      f.write(f"### スキル: {skill_name}\n\n")
                      with open(path, "r", encoding="utf-8") as sf:
                          f.write(sf.read() + "\n\n")
              else:
                  f.write("スキル定義ファイル(SKILL.md)が見つかりませんでした。\n\n")

              f.write("---\n\n")

              # 3. ワークフロー集 (global_workflows/*.md)
              f.write("## 3. ワークフロー集\n\n")
              workflow_files = glob.glob("global_workflows/*.md")
              if workflow_files:
                  for path in workflow_files:
                      workflow_name = os.path.basename(path).replace(".md", "")
                      f.write(f"### ワークフロー: {workflow_name}\n\n")
                      with open(path, "r", encoding="utf-8") as wf:
                          f.write(wf.read() + "\n\n")
              else:
                  f.write("ワークフローファイルが見つかりませんでした。\n\n")
          EOF
          python generate.py

      - name: Setup rclone
        uses: rclone/rclone-action@v1

      - name: Upload to Google Drive
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: '{"access_token":"dummy","token_type":"Bearer","refresh_token":"${{ secrets.GDRIVE_REFRESH_TOKEN }}","expiry":"2023-01-01T00:00:00Z"}'
        run: |
          # 指定したフォルダIDに「notebooklm-source.md」という
