name: Build NotebookLM Source

on:
  push:
    branches:
      - main
    paths:
      - 'governance/**'
      - 'skills/**'
      - 'global_workflows/**'
      - 'GEMINI.md'
      - '.github/workflows/notebooklm-pages.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Files
        run: |
          cat << 'EOF' > generate.py
          import os, glob
          from datetime import datetime

          output_dir = "public"
          os.makedirs(output_dir, exist_ok=True)
          md_filename = "notebooklm-source.md"
          output_file = os.path.join(output_dir, md_filename)

          with open(output_file, "w", encoding="utf-8") as f:
              f.write("# Antigravity Knowledge Base\n\n")
              f.write(f"**最終更新日時:** {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\n\n")
              f.write("---\n\n")

              # 1. ガバナンス
              f.write("## 1. ガバナンス\n\n")
              gov_files = glob.glob("governance/*.md")
              if os.path.exists("GEMINI.md"):
                  gov_files.insert(0, "GEMINI.md")
              
              if gov_files:
                  for path in gov_files:
                      f.write(f"### {os.path.basename(path)}\n\n")
                      with open(path, "r", encoding="utf-8") as gf:
                          f.write(gf.read() + "\n\n")
              else:
                  f.write("ガバナンス資料が見つかりませんでした。\n\n")

              f.write("---\n\n")

              # 2. スキル集 (skills/*/SKILL.md)
              f.write("## 2. スキル集\n\n")
              skill_files = glob.glob("skills/*/SKILL.md")
              if skill_files:
                  for path in skill_files:
                      # ディレクトリ名を取得してスキル名とする
                      skill_name = os.path.basename(os.path.dirname(path))
                      f.write(f"### スキル: {skill_name}\n\n")
                      with open(path, "r", encoding="utf-8") as sf:
                          f.write(sf.read() + "\n\n")
              else:
                  f.write("スキル定義ファイルが見つかりませんでした。\n\n")

              f.write("---\n\n")

              # 3. ワークフロー集 (global_workflows/*.md)
              f.write("## 3. ワークフロー集\n\n")
              workflow_files = glob.glob("global_workflows/*.md")
              if workflow_files:
                  for path in workflow_files:
                      workflow_name = os.path.basename(path).replace(".md", "")
                      f.write(f"### ワークフロー: {workflow_name}\n\n")
                      with open(path, "r", encoding="utf-8") as wf:
                          f.write(wf.read() + "\n\n")
              else:
                  f.write("ワークフローファイルが見つかりませんでした。\n\n")

          # index.html の生成
          html_file = os.path.join(output_dir, "index.html")
          with open(html_file, "w", encoding="utf-8") as f:
              f.write(f"""<!DOCTYPE html>
          <html lang="ja">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Antigravity Knowledge Portal</title>
              <style>
                  body {{ font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: 40px auto; padding: 20px; color: #333; }}
                  .card {{ border: 1px solid #ddd; padding: 20px; border-radius: 8px; background: #f9f9f9; }}
                  button {{ background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }}
                  button:hover {{ background: #0056b3; }}
                  .url-box {{ background: #eee; padding: 10px; border-radius: 4px; font-family: monospace; word-break: break-all; margin: 10px 0; }}
              </style>
          </head>
          <body>
              <h1>Antigravity Knowledge Portal</h1>
              <div class="card">
                  <p>NotebookLM用の集約ファイルを生成しました。</p>
                  <p><strong>最終更新:</strong> {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}</p>
                  
                  <h3>1. 直接ファイルをダウンロード</h3>
                  <a href="{md_filename}" download><button>Markdownをダウンロード</button></a>
                  
                  <h3>2. NotebookLMのソースURLとして使用</h3>
                  <div class="url-box" id="urlText"></div>
                  <button onclick="copyUrl()">URLをコピー</button>
              </div>
              <script>
                  const fullUrl = window.location.href + "{md_filename}";
                  document.getElementById("urlText").innerText = fullUrl;
                  function copyUrl() {{
                      navigator.clipboard.writeText(fullUrl);
                      alert("URLをコピーしました！");
                  }}
              </script>
          </body>
          </html>""")
          EOF
          python generate.py

      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
